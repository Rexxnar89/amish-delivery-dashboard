name: Live prices
on:
  schedule:
    - cron: "0 10 * * *"   # 6am ET during daylight time (5am ET in winter)
  workflow_dispatch:
    inputs:
      full:
        description: "Check every product now (like a Monday run)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: prices
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-prices.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FULL: ${{ inputs.full }}
          MONTH_BUDGET: "230"
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json price-changes.json
          git diff --cached --quiet || (git commit -m "Prices $(date -u +%F)" && git push)
